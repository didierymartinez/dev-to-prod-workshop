<title>Universo Cosmos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: un sistema estelar a pantalla completa. La Estación de Control arriba, los planetas del
   Application Plane abajo, el portal (Front Door) a la izquierda. Paneles flotantes: inspector a la
   derecha, lección abajo a la izquierda. Un solo look oscuro, a propósito: es el espacio. */
:root {
  color-scheme: dark;
  --vacio: #060818;
  --panel: #0b1030f0;
  --borde: #2a3470;
  --texto: #eef0ff;
  --tenue: #98a0cf;
  --control: #ffb547;   /* el Control Plane: la estrella dorada */
  --app: #4fd1ff;       /* el Application Plane: planetas azules */
  --bus: #b48cff;       /* Azure Service Bus: el hiperespacio */
  --ok: #43e6a0;
  --peligro: #ff4d6d;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --cuerpo: "Atkinson Hyperlegible", system-ui, sans-serif;
  --codigo: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--vacio); color: var(--texto); font-family: var(--cuerpo); font-size: 15px; overflow: hidden; }
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--control); outline-offset: 2px; }

.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: linear-gradient(#070a20, #060818); border-bottom: 1px solid var(--borde); }
.marca { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; white-space: nowrap; }
.marca span { color: var(--control); }
.marca small { font-family: var(--cuerpo); font-weight: 400; font-size: 11px; letter-spacing: 1px; color: var(--ok); margin-left: 8px; text-transform: none; }
.tenants { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tenants > span { font-size: 11px; color: var(--tenue); letter-spacing: 1px; text-transform: uppercase; margin-right: 2px; }
.tchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border: 1px solid var(--borde); border-radius: 999px; background: #0d1336; font-size: 13px; white-space: nowrap; }
.tchip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.tchip em { font-style: normal; font-size: 11px; color: var(--tenue); }
.tchip.sel { border-color: var(--texto); background: #19205a; }
.empuje { flex: 1; }
.accion { font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; padding: 7px 12px; border: 1px solid var(--borde); background: #0d1336; border-radius: 4px; white-space: nowrap; }
.accion:hover { border-color: var(--app); }
.accion.cp { border-color: #6b5321; }
.accion.on { background: #123d34; border-color: var(--ok); }

.espacio { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
.espacio.arrastrando { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.capa { position: absolute; inset: 0; pointer-events: none; }
.rotulo { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; text-shadow: 0 1px 6px #000; }
.rotulo b { display: block; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
.rotulo span { display: block; font-size: 11px; color: var(--tenue); }
.rotulo.cp b { color: var(--control); }
.rotulo.bus b { color: var(--bus); }
.rotulo.peq b { font-size: 10px; letter-spacing: 1px; }
.rotulo.peq span { display: none; }
.rotulo.sel b { color: var(--texto); text-decoration: underline; text-underline-offset: 3px; }
.rotulo.sel span { display: block; }
.rotulo.lado { transform: translate(0, -50%); text-align: left; }

.panel { position: absolute; background: var(--panel); border: 1px solid var(--borde); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 24px); overflow: auto; backdrop-filter: blur(6px); }
.panel h2 { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 1px; text-transform: uppercase; text-wrap: balance; padding-right: 20px; }
.panel h3 { font-family: var(--display); font-weight: 500; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--tenue); margin-top: 4px; }
.panel p { line-height: 1.45; max-width: 62ch; }
.panel pre { font-family: var(--codigo); font-size: 12px; background: #050716; border: 1px solid var(--borde); border-radius: 4px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ok); }
.cerrar { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--tenue); font-size: 18px; line-height: 1; }
.insignias { display: flex; flex-wrap: wrap; gap: 6px; }
.ins { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; border: 1px solid var(--borde); color: var(--tenue); }
.ins.cp { border-color: #6b5321; color: var(--control); }
.ins.app { border-color: #1f5874; color: var(--app); }
.ins.bus { border-color: #4b3a7a; color: var(--bus); }
.ins.codigo { border-color: #1f6b4f; color: var(--ok); }
.ins.diseno { border-color: #6b5321; color: var(--control); }
.ins.riesgo { border-color: #7a2335; color: var(--peligro); }
.fuente { font-size: 12px; color: var(--tenue); border-top: 1px dashed var(--borde); padding-top: 8px; }
#inspector { top: 12px; right: 12px; width: min(400px, calc(100% - 32px)); }
#leccion { left: 12px; bottom: 12px; width: min(540px, calc(100% - 32px)); border-color: #6b5321; max-height: min(62%, 560px); }
.paso { font-family: var(--display); font-size: 12px; letter-spacing: 2px; color: var(--control); text-transform: uppercase; }
.barra-paso { height: 3px; background: var(--borde); border-radius: 2px; overflow: hidden; }
.barra-paso i { display: block; height: 100%; background: var(--control); transition: width 0.3s; }
.texto-paso { font-size: 17px; line-height: 1.45; }
.opciones { display: grid; gap: 6px; }
.opciones button { text-align: left; background: #0f1640; border: 1px solid var(--borde); border-radius: 4px; padding: 9px 12px; font-size: 15px; line-height: 1.3; }
.opciones button:hover:not([disabled]) { border-color: var(--app); }
.opciones button.bien { border-color: var(--ok); background: #0e3329; }
.opciones button.mal { border-color: var(--peligro); background: #3a1022; }
.feedback { line-height: 1.4; }
.controles { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-family: var(--display); font-weight: 500; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; padding: 8px 12px; border: 1px solid var(--borde); border-radius: 4px; background: #0f1640; }
.btn.prim { background: #4a3510; border-color: var(--control); color: #ffe2a8; }
.btn[disabled] { opacity: 0.35; cursor: default; }
#misiones, #p-lecciones { top: 12px; left: 12px; width: min(460px, calc(100% - 32px)); }
.mision { display: grid; grid-template-columns: 26px 1fr; gap: 6px 10px; padding: 10px 0; border-top: 1px solid var(--borde); }
.mision .n { font-family: var(--display); font-weight: 700; color: var(--tenue); font-size: 15px; }
.mision.hecha .n { color: var(--ok); }
.mision .q { line-height: 1.35; }
.mision .q small { display: block; color: var(--tenue); font-size: 12px; margin-top: 3px; }
.mision button { grid-column: 2; justify-self: start; }
.lista { display: grid; gap: 6px; }
.lista .btn { text-align: left; }

@media (max-width: 640px) {
  .tenants > span { display: none; }
  #inspector { top: auto; bottom: 12px; max-height: 55%; }
  #leccion { max-height: 50%; }
  .texto-paso { font-size: 15px; }
}
</style>

<div id="app">
  <header class="barra">
    <div class="marca">Universo <span>Cosmos</span><small>● simulación</small></div>
    <div class="tenants" id="tenants"><span>Tenants</span></div>
    <span class="empuje"></span>
    <button class="accion on" id="b-trafico" aria-pressed="true">Tráfico en vivo</button>
    <button class="accion" id="b-lecciones">Lecciones</button>
    <button class="accion cp" id="b-misiones">Misiones <span id="m-cuenta">0/8</span></button>
  </header>

  <main class="espacio" id="espacio">
    <canvas id="lienzo" aria-label="Mapa del universo de Cosmos: Control Plane, Application Plane y sus rutas de mensajes"></canvas>
    <div class="capa" id="capa"></div>

    <section class="panel" id="inspector" hidden aria-live="polite"></section>

    <section class="panel" id="leccion" hidden>
      <button class="cerrar" id="l-cerrar" aria-label="Cerrar lección">×</button>
      <h2 id="l-titulo"></h2>
      <div class="paso" id="l-paso"></div>
      <div class="barra-paso"><i id="l-progreso"></i></div>
      <div class="texto-paso" id="l-texto"></div>
      <div class="opciones" id="l-opciones"></div>
      <div class="feedback" id="l-feedback"></div>
      <div class="controles">
        <button class="btn" id="l-prev">‹ Anterior</button>
        <button class="btn prim" id="l-next">Siguiente ›</button>
        <button class="btn" id="l-replay">Repetir paso</button>
      </div>
    </section>

    <section class="panel" id="misiones" hidden>
      <button class="cerrar" id="m-cerrar" aria-label="Cerrar misiones">×</button>
      <h2>Lo que debes poder explicar</h2>
      <p class="fuente">Cada misión se gana completando su lección: primero predices, después ves viajar las naves. Después, explícala sin mirar.</p>
      <div id="m-lista"></div>
    </section>

    <section class="panel" id="p-lecciones" hidden>
      <button class="cerrar" id="pl-cerrar" aria-label="Cerrar lecciones">×</button>
      <h2>Lecciones</h2>
      <p class="fuente">Cada lección pone naves a viajar por las rutas reales de la plataforma, paso a paso.</p>
      <div class="lista" id="pl-lista"></div>
    </section>
  </main>
</div>

  if (sel) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]); ctx.lineDashOffset = -est.t * 0.3; ctx.beginPath(); ctx.arc(x, y, r + 9, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
}
// Las colonias: un punto por tenant activo en cada planeta (tenancy conjoined: mismas tablas, distinto tenant_id)
function colonias(c, x, y, r) {
  TENANTS.filter(t => !t.oculto).forEach((t, i) => {
    const a = -0.6 + i * 0.9 + est.t * 0.003;
    const cx = x + Math.cos(a) * r * 0.62, cy = y + Math.sin(a) * r * 0.4;
    const suspendido = t.estado === 'Suspendido';
    const foco = !est.tenant || est.tenant === t.id;
    ctx.globalAlpha = foco ? 1 : 0.2;
    ctx.fillStyle = suspendido ? '#5a5f7a' : t.color; ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, 7); ctx.fill();
    if (suspendido) { ctx.strokeStyle = K.peligro; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - 4, cy - 4); ctx.lineTo(cx + 4, cy + 4); ctx.stroke(); }
    else if (est.tenant === t.id) { ctx.strokeStyle = t.color; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, 7 + Math.sin(est.t * 0.1) * 1.5, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
  });
}

// ═══════════════ Naves ═══════════════
function nave(ruta, color, opts = {}) { return { ruta, color, t: 0, vel: opts.vel || 1, ...opts }; }
function moverNave(n) {
  const pts = n.ruta.map(deMundo), tramos = Math.max(1, pts.length - 1);
  const dur = 70 / n.vel, prog = Math.min(1, n.t / (tramos * dur));
  let i = Math.min(tramos - 1, Math.floor(prog * tramos)), f = prog * tramos - i;
  if (pts.length === 1) pts.push(pts[0]);
  if (n.bloqueado && prog > 0.8) { i = tramos - 1; f = 0.8; }
  const [x, y] = pts[i] === pts[i + 1] ? [pts[i][0] + Math.sin(f * 6.28) * 18, pts[i][1] - Math.abs(Math.sin(f * 3.14)) * 18] : curva(pts[i], pts[i + 1], f);
  // estela
  n.estela = n.estela || []; n.estela.push([x, y]); if (n.estela.length > 16) n.estela.shift();
  n.estela.forEach(([ex, ey], k) => { ctx.globalAlpha = (k / 16) * 0.6; ctx.fillStyle = n.color; ctx.beginPath(); ctx.arc(ex, ey, 1 + k / 8, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, n.grande ? 4.5 : 2.6, 0, 7); ctx.fill();
  if (n.grande) { ctx.strokeStyle = n.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.stroke(); }
  if (n.bloqueado && prog > 0.8) { ctx.fillStyle = K.peligro; ctx.font = '700 12px "Chakra Petch", sans-serif'; ctx.fillText('RECHAZADA', x + 10, y - 8); }
  if (n.duplicado && prog >= 1) { ctx.fillStyle = K.ok; ctx.font = '700 12px "Chakra Petch", sans-serif'; ctx.fillText('DUPLICADO · DESCARTADO', x + 12, y - 10); }
  n.t++;
  return prog >= 1;
}
const AMBIENTE = [
  [['usuarios', 'frontdoor', 'gateway', 'radicacion'], K.app], [['usuarios', 'frontdoor', 'gateway', 'contabilidad'], K.app], [['usuarios', 'frontdoor', 'gateway', 'impuestos'], K.app],
  [['tenantmgr', 'asb', 'opp'], K.bus], [['billing', 'asb', 'contabilidad'], K.bus], [['entradas', 'rabbit', 'radicacion'], '#ff8f5a'],
  [['radicacion', 'archivo'], K.ok], [['contabilidad', 'archivo'], K.ok], [['rabbit', 'notificaciones'], '#ff8f5a'], [['asb', 'notificaciones'], K.bus],
];

// ═══════════════ Bucle ═══════════════
function cuadro() {
  est.t++;
  fondo(); dibujarRutas();
  const orden = [...CUERPOS].sort((a, b) => pos(a)[1] - pos(b)[1]);
  orden.forEach(dibujarCuerpo);
  if (est.trafico && !est.leccion && est.t % 28 === 0 && est.naves.length < 14) { const [r, c] = AMBIENTE[(est.t / 28) % AMBIENTE.length | 0]; est.naves.push(nave(r, c, { vel: 0.8 + Math.random() * 0.6 })); }
  est.naves = est.naves.filter(n => !moverNave(n));
  if (est.anim) { const fin = moverNave(est.anim); if (fin && !est.anim.fin) { est.anim.fin = true; alTerminarAnim(est.anim); } if (fin && est.anim.t > est.anim.ruta.length * 70 + 120) { est.anim.t = 0; est.anim.estela = []; est.anim.fin = false; } }
  rotulos();
  requestAnimationFrame(cuadro);
}

// ═══════════════ Rótulos HTML ═══════════════
const rot = new Map();
function rotulos() {
  const vivos = new Set();
  for (const c of CUERPOS) {
    const [x, y] = deMundo(c.id); const r = c.r * est.cam.z;
    const pequeño = ['luna', 'modulo', 'satelite'].includes(c.tipo);
    if (pequeño && est.cam.z < 0.55 && est.sel !== c.id && est.hover !== c.id) continue;
    let el = rot.get(c.id);
    if (!el) { el = document.createElement('div'); capa.appendChild(el); rot.set(c.id, el); el.dataset.h = ''; }
    const marca = c.estado === 'diseno' ? ' · en diseño' : '';
    const h = `<b>${c.nombre}</b><span>${c.sub}${marca}</span>`;
    if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; }
    el.className = 'rotulo ' + (c.plano === 'cp' ? 'cp ' : c.plano === 'bus' ? 'bus ' : '') + (pequeño ? 'peq ' : '') + (est.sel === c.id || est.hover === c.id ? 'sel' : '');
    if (pequeño) { el.classList.add('lado'); el.style.left = (x + r + 6) + 'px'; el.style.top = y + 'px'; }
    else if (c.tipo === 'estrella') { el.style.left = x + 'px'; el.style.top = (y - r - 40) + 'px'; }
    else { el.style.left = x + 'px'; el.style.top = (y + r + (c.tipo === 'portal' ? r * 0.4 : 6)) + 'px'; }
    vivos.add(c.id);
  }
  for (const [id, el] of rot) if (!vivos.has(id)) { el.remove(); rot.delete(id); }
}

// ═══════════════ Tenants (barra) ═══════════════
function pintarTenants() {
  const cont = document.getElementById('tenants');
  cont.querySelectorAll('.tchip').forEach(x => x.remove());
  TENANTS.filter(t => !t.oculto).forEach(t => {
    const b = document.createElement('button'); b.className = 'tchip' + (est.tenant === t.id ? ' sel' : '');
    b.innerHTML = `<i style="background:${t.estado === 'Suspendido' ? '#5a5f7a' : t.color}"></i>${t.nombre} <em>${t.estado}</em>`;
    b.title = 'Resaltar sus colonias en todos los planetas';
    b.onclick = () => { est.tenant = est.tenant === t.id ? null : t.id; pintarTenants(); };
    cont.appendChild(b);
  });
}

// ═══════════════ Inspector ═══════════════
const insp = document.getElementById('inspector');
function inspeccionar(id) {
  est.sel = id; if (!id) { insp.hidden = true; return; }
  const c = C[id];
  const plano = c.plano === 'cp' ? '<span class="ins cp">Control Plane</span>' : c.plano === 'bus' ? '<span class="ins bus">Mensajería</span>' : c.plano === 'app' ? '<span class="ins app">Application Plane</span>' : '<span class="ins">Borde</span>';
  const estado = c.estado === 'diseno' ? '<span class="ins diseno">En diseño</span>' : c.estado === 'codigo' ? '<span class="ins codigo">Existe en código</span>' : '';
  const lec = LECCIONES.filter(l => l.pasos.some(p => p.ruta && p.ruta.includes(id)));
  insp.innerHTML = `<button class="cerrar" aria-label="Cerrar">×</button>
    <h2>${c.nombre}</h2>
    <div class="insignias">${plano}${estado}${c.riesgo ? '<span class="ins riesgo">Riesgo abierto</span>' : ''}</div>
    <h3>Qué es</h3><p>${c.que}</p>
    <h3>En este universo</h3><p>${c.metafora}</p>
    <h3>En la plataforma real</h3><p>${c.real}</p>
    ${c.riesgo ? `<h3>Riesgo encontrado</h3><p style="color:var(--peligro)">${c.riesgo}</p>` : ''}
    ${c.tf ? `<h3>En el código</h3><pre>${c.tf}</pre>` : ''}
    ${lec.length ? `<h3>Aparece en</h3><div class="controles">${lec.map(l => `<button class="btn" data-l="${l.id}">${l.titulo}</button>`).join('')}</div>` : ''}
    <p class="fuente">Fuente: ${c.fuente}</p>`;
  insp.hidden = false;
  insp.querySelector('.cerrar').onclick = () => inspeccionar(null);
  insp.querySelectorAll('[data-l]').forEach(b => b.onclick = () => abrirLeccion(b.dataset.l));
}

// ═══════════════ Lecciones ═══════════════
const $ = id => document.getElementById(id);
function abrirLeccion(id) {
  est.leccion = LECCIONES.find(l => l.id === id); est.paso = 0; est.naves = [];
  ['p-lecciones', 'misiones'].forEach(p => $(p).hidden = true);
  if (id === 'tenant') { T.norte.oculto = true; T.norte.estado = 'Registrado'; }
  if (id === 'cartera') { T.sur.estado = 'Activado'; }
  pintarTenants();
  $('leccion').hidden = false; mostrarPaso();
}
function alTerminarAnim(a) {
  if (a.tenant) { const [tid, estado] = a.tenant; T[tid].estado = estado; if (a.aparece) T[tid].oculto = false; pintarTenants(); }
}
function mostrarPaso() {
  const lec = est.leccion, p = lec.pasos[est.paso];
  $('l-titulo').textContent = lec.titulo;
  $('l-paso').textContent = `Paso ${est.paso + 1} de ${lec.pasos.length}`;
  $('l-progreso').style.width = ((est.paso + 1) / lec.pasos.length * 100) + '%';
  $('l-opciones').innerHTML = ''; $('l-feedback').innerHTML = '';
  $('l-prev').disabled = est.paso === 0;
  $('l-next').textContent = est.paso === lec.pasos.length - 1 ? 'Terminar ✓' : 'Siguiente ›';
  if (p.pregunta) {
    est.anim = null;
    $('l-texto').innerHTML = `<strong style="color:var(--control)">Predice.</strong> ${p.pregunta}`;
    $('l-next').disabled = true;
    p.opciones.forEach(([txt, ok, fb], i) => {
      const b = document.createElement('button'); b.textContent = txt;
      b.onclick = () => {
        $('l-opciones').querySelectorAll('button').forEach((x, j) => { x.disabled = true; if (p.opciones[j][1]) x.classList.add('bien'); });
        if (!ok) b.classList.add('mal');
        $('l-feedback').innerHTML = `<strong style="color:${ok ? 'var(--ok)' : 'var(--peligro)'}">${ok ? 'Bien.' : 'No exactamente.'}</strong> ${fb}`;
        $('l-next').disabled = false;
      };
      $('l-opciones').appendChild(b);
    });
  } else {
    $('l-texto').textContent = p.texto; $('l-next').disabled = false;
    est.anim = nave(p.ruta, p.color, { grande: true, vel: 0.9, bloqueado: p.bloqueado, duplicado: p.duplicado, tenant: p.tenant, aparece: p.aparece });
  }
}
$('l-next').onclick = () => {
  const lec = est.leccion;
  if (est.paso < lec.pasos.length - 1) { if (est.anim && !est.anim.fin) alTerminarAnim(est.anim); est.paso++; mostrarPaso(); return; }
  if (est.anim && !est.anim.fin) alTerminarAnim(est.anim);
  est.hechas.add(lec.id); guardar(); pintarMisiones();
  const ms = MISIONES.filter(m => m[2] === lec.id).map(m => `«${m[1]}»`).join(' y ');
  $('l-texto').innerHTML = `<strong style="color:var(--ok)">Lección completa.</strong> Ahora intenta responder, sin mirar: ${ms}`;
  $('l-opciones').innerHTML = ''; $('l-feedback').innerHTML = ''; $('l-next').disabled = true; est.anim = null;
};
$('l-prev').onclick = () => { if (est.paso > 0) { est.paso--; mostrarPaso(); } };
$('l-replay').onclick = () => { if (est.anim) { est.anim.t = 0; est.anim.estela = []; est.anim.fin = false; } };
$('l-cerrar').onclick = () => { $('leccion').hidden = true; est.leccion = null; est.anim = null; };

function pintarMisiones() {
  const hecha = m => est.hechas.has(m[2]);
  $('m-cuenta').textContent = `${MISIONES.filter(hecha).length}/${MISIONES.length}`;
  $('m-lista').innerHTML = MISIONES.map(m => `<div class="mision ${hecha(m) ? 'hecha' : ''}"><span class="n">${hecha(m) ? '✓' : m[0]}</span>
    <div class="q">${m[1]}<small>${hecha(m) ? 'Lección hecha. ¿La explicarías sin mirar?' : 'Se gana en: ' + LECCIONES.find(l => l.id === m[2]).titulo}</small></div>
    <button class="btn" data-l="${m[2]}">${hecha(m) ? 'Repasar' : 'Ir'}</button></div>`).join('');
  $('m-lista').querySelectorAll('[data-l]').forEach(b => b.onclick = () => abrirLeccion(b.dataset.l));
  $('pl-lista').innerHTML = LECCIONES.map(l => `<button class="btn ${est.hechas.has(l.id) ? 'prim' : ''}" data-l="${l.id}">${est.hechas.has(l.id) ? '✓ ' : ''}${l.titulo}</button>`).join('');
  $('pl-lista').querySelectorAll('[data-l]').forEach(b => b.onclick = () => abrirLeccion(b.dataset.l));
}
function alternar(id) { const abrir = $(id).hidden; ['p-lecciones', 'misiones'].forEach(x => $(x).hidden = true); $(id).hidden = !abrir; }
$('b-lecciones').onclick = () => alternar('p-lecciones');
$('b-misiones').onclick = () => alternar('misiones');
$('m-cerrar').onclick = () => $('misiones').hidden = true;
$('pl-cerrar').onclick = () => $('p-lecciones').hidden = true;
$('b-trafico').onclick = () => { est.trafico = !est.trafico; $('b-trafico').classList.toggle('on', est.trafico); $('b-trafico').setAttribute('aria-pressed', est.trafico); };

// ═══════════════ Cámara e interacción ═══════════════
function cuerpoEn(px, py) {
  let mejor = null, d = Infinity;
  for (const c of CUERPOS) { const [x, y] = deMundo(c.id); const dd = Math.hypot(px - x, py - y); if (dd < Math.max(14, c.r * est.cam.z + 8) && dd < d) { d = dd; mejor = c.id; } }
  return mejor;
}
let arr = null;
espacio.addEventListener('pointerdown', e => { if (e.target !== lienzo) return; arr = { x: e.clientX, y: e.clientY, cx: est.cam.x, cy: est.cam.y, movio: false }; });
window.addEventListener('pointermove', e => {
  const r = lienzo.getBoundingClientRect();
  if (arr) { const dx = e.clientX - arr.x, dy = e.clientY - arr.y; if (Math.abs(dx) + Math.abs(dy) > 4) { arr.movio = true; espacio.classList.add('arrastrando'); } est.cam.x = arr.cx + dx; est.cam.y = arr.cy + dy; return; }
  if (e.target === lienzo) { est.hover = cuerpoEn(e.clientX - r.left, e.clientY - r.top); lienzo.style.cursor = est.hover ? 'pointer' : ''; }
});
window.addEventListener('pointerup', e => {
  if (arr && !arr.movio) { const r = lienzo.getBoundingClientRect(); inspeccionar(cuerpoEn(e.clientX - r.left, e.clientY - r.top)); }
  arr = null; espacio.classList.remove('arrastrando');
});
espacio.addEventListener('wheel', e => { e.preventDefault(); est.cam.z = Math.min(2, Math.max(0.3, est.cam.z * (e.deltaY < 0 ? 1.08 : 0.93))); }, { passive: false });
document.addEventListener('keydown', e => {
  if (e.key === 'l' || e.key === 'L') alternar('p-lecciones');
  else if (e.key === 'j' || e.key === 'J') alternar('misiones');
  else if (e.key === 'f' || e.key === 'F') encuadrar();
  else if (e.key === 'Escape') { inspeccionar(null); }
});
window.addEventListener('resize', () => { redimensionar(); encuadrar(); });

// ═══════════════ Arranque: en estado de trabajo (tráfico en vivo + la primera lección abierta) ═══════════════
redimensionar(); encuadrar(); pintarTenants(); pintarMisiones();
requestAnimationFrame(cuadro);
abrirLeccion('tenant');
</script>
