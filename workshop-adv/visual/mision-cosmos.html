<title>Misión Cosmos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: un juego a pantalla completa. El espacio es el canvas; arriba el HUD de la misión,
   abajo a la izquierda la radio con COSMO (el copiloto), abajo a la derecha el minimapa.
   Al llegar a un sector se abre la consola de construcción. Un solo look oscuro: es el espacio. */
:root {
  color-scheme: dark;
  --vacio: #050714;
  --panel: #0a0f2cf2;
  --borde: #283270;
  --texto: #eef0ff;
  --tenue: #98a0cf;
  --oro: #ffb547;       /* Control Plane, recompensas */
  --cian: #4fd1ff;      /* Application Plane, la nave */
  --lila: #b48cff;      /* mensajería */
  --ok: #43e6a0;
  --mal: #ff4d6d;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --cuerpo: "Atkinson Hyperlegible", system-ui, sans-serif;
  --codigo: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--vacio); color: var(--texto); font-family: var(--cuerpo); font-size: 15px; overflow: hidden; }
#juego { position: fixed; inset: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }

.hud { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.titulo { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 2px 10px #000; }
.titulo span { color: var(--oro); }
.medidor { display: flex; align-items: center; gap: 8px; background: #0a0f2ccc; border: 1px solid var(--borde); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.medidor b { font-family: var(--display); color: var(--oro); }
.barra { width: 110px; height: 6px; background: #1a2150; border-radius: 3px; overflow: hidden; }
.barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--cian), var(--ok)); transition: width 0.6s; }
.empuje { flex: 1; }
.boton { font-family: var(--display); font-weight: 500; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; padding: 7px 12px; border: 1px solid var(--borde); border-radius: 4px; background: #0d1336e6; white-space: nowrap; }
.boton:hover { border-color: var(--cian); }
.boton.oro { background: #4a3510; border-color: var(--oro); color: #ffe2a8; }

.radio { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(460px, calc(100% - 32px)); display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 14px; }
.radio canvas { position: static; width: 54px; height: 54px; }
.radio .quien { font-family: var(--display); font-size: 11px; letter-spacing: 2px; color: var(--cian); text-transform: uppercase; }
.radio p { line-height: 1.4; margin-top: 3px; }
.radio .tecla { font-size: 12px; color: var(--tenue); margin-top: 6px; }
.mini { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 180px; height: 130px; background: #070b22d9; border: 1px solid var(--borde); border-radius: 8px; }
.mini canvas { position: static; width: 180px; height: 130px; }

.consola { position: absolute; inset: 0; display: grid; place-items: center; background: #02030acc; padding: 16px; }
.caja { width: min(720px, 100%); max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 80px #000; }
.caja header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.caja .sector { font-family: var(--display); font-size: 12px; letter-spacing: 2px; color: var(--tenue); text-transform: uppercase; }
.caja h2 { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 1px; text-wrap: balance; width: 100%; }
.etapas { display: flex; gap: 6px; }
.etapas i { flex: 1; height: 4px; border-radius: 2px; background: #1a2150; }
.etapas i.hecha { background: var(--oro); }
.etapas i.ahora { background: var(--cian); }
.caja h3 { font-family: var(--display); font-weight: 500; font-size: 12px; letter-spacing: 2px; color: var(--oro); text-transform: uppercase; }
.caja p { line-height: 1.5; max-width: 64ch; }
.caja pre { font-family: var(--codigo); font-size: 12.5px; background: #050716; border: 1px solid var(--borde); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ok); }
.opciones { display: grid; gap: 8px; }
.opciones button { text-align: left; background: #0f1640; border: 1px solid var(--borde); border-radius: 6px; padding: 10px 14px; line-height: 1.35; }
.opciones button:hover:not([disabled]) { border-color: var(--cian); }
.opciones button.bien { border-color: var(--ok); background: #0e3329; }
.opciones button.mal { border-color: var(--mal); background: #3a1022; }
.piezas { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.pieza { text-align: left; background: #0f1640; border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pieza b { font-family: var(--display); font-size: 14px; letter-spacing: 0.5px; }
.pieza span { font-size: 13px; color: var(--tenue); line-height: 1.35; }
.pieza.elegida { border-color: var(--ok); background: #0e3329; }
.pieza.rechazada { border-color: var(--mal); background: #3a1022; }
.pieza.rechazada span { color: #ffb3c1; }
.nota { font-size: 14px; line-height: 1.45; }
.nota.bien b { color: var(--ok); }
.nota.mal b { color: var(--mal); }
.fuente { font-size: 12px; color: var(--tenue); border-top: 1px dashed var(--borde); padding-top: 10px; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.acciones .boton { padding: 10px 16px; font-size: 13px; }
.acciones .boton[disabled] { opacity: 0.35; cursor: default; }
.bitacora .fila { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--borde); }
.bitacora .num { font-family: var(--display); font-weight: 700; color: var(--tenue); }
.bitacora .fila.hecho .num { color: var(--ok); }
.bitacora small { display: block; color: var(--tenue); font-size: 12px; }

@media (max-width: 640px) {
  .mini { display: none; }
  .radio { grid-template-columns: 40px 1fr; padding: 10px; }
  .radio canvas { width: 40px; height: 40px; }
  .caja { padding: 16px; }
  .caja h2 { font-size: 20px; }
  .barra { width: 70px; }
}
@media (prefers-reduced-motion: reduce) { .barra i { transition: none; } }
</style>

<div id="juego">
  <canvas id="lienzo" aria-label="El espacio de Cosmos: pilota la nave hasta cada sector para construirlo"></canvas>

  <div class="hud">
    <div class="titulo">Misión <span>Cosmos</span></div>
    <div class="medidor">Construido <b id="h-sectores">0/0</b><div class="barra"><i id="h-barra" style="width:0"></i></div></div>
    <div class="medidor">★ <b id="h-estrellas">0</b> estrellas</div>
    <span class="empuje"></span>
    <button class="boton" id="b-bitacora">Bitácora</button>
    <button class="boton" id="b-rumbo">Rumbo al siguiente</button>
  </div>

  <div class="radio" id="radio" aria-live="polite">
    <canvas id="cara" width="108" height="108" aria-hidden="true"></canvas>
    <div><div class="quien">COSMO · copiloto</div><p id="radio-texto"></p><div class="tecla" id="radio-tecla"></div></div>
  </div>
  <div class="mini"><canvas id="mapa" width="360" height="260" aria-label="Minimapa"></canvas></div>

  <div class="consola" id="consola" hidden><div class="caja" id="caja" role="dialog" aria-modal="true"></div></div>
</div>

<script>
// ══════════════════════ Contenido: los sectores del taller ══════════════════════
// Cada sector es una sección del taller. Etapas: briefing → predicción → ensamblaje → construcción → prueba → bitácora.
// `piezas`: el alumno elige las correctas; las incorrectas explican por qué no.
// `estructura`: qué aparece en el espacio al construirlo · `prueba`: ruta de naves que la atraviesan.
const SECTORES = [];   // se llena abajo (CONTENIDO)

// ══════════════════════ Utilidades ══════════════════════
const $ = id => document.getElementById(id);
const K = { oro: '#ffb547', cian: '#4fd1ff', lila: '#b48cff', ok: '#43e6a0', mal: '#ff4d6d', texto: '#eef0ff', tenue: '#98a0cf', naranja: '#ff8f5a' };
const lienzo = $('lienzo'), ctx = lienzo.getContext('2d');
let W = 0, H = 0, DPR = 1;
function redimensionar() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; lienzo.width = W * DPR; lienzo.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', redimensionar); redimensionar();
const azar = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(42);

// ══════════════════════ Estado ══════════════════════
const est = {
  nave: { x: 0, y: 260, vx: 0, vy: 0, ang: -Math.PI / 2, motor: false },
  destino: null, teclas: {}, cam: { x: 0, y: 0 }, t: 0,
  hechos: new Set(), estrellas: 0, abierto: null, etapa: 0, naves: [], nacimientos: {}, chispas: [],
};
try { const g = JSON.parse(localStorage.getItem('mision-cosmos') || '{}'); (g.hechos || []).forEach(x => est.hechos.add(x)); est.estrellas = g.estrellas || 0; } catch {}
function guardar() { try { localStorage.setItem('mision-cosmos', JSON.stringify({ hechos: [...est.hechos], estrellas: est.estrellas })); } catch {} }
const siguiente = () => SECTORES.find(s => !est.hechos.has(s.id));
const desbloqueado = s => SECTORES.indexOf(s) === 0 || est.hechos.has(SECTORES[SECTORES.indexOf(s) - 1].id);

// ══════════════════════ Fondo: estrellas en capas y nebulosas ══════════════════════
const estrellas = Array.from({ length: 700 }, () => ({ x: azar() * 6000 - 3000, y: azar() * 4400 - 2200, p: [0.15, 0.35, 0.7][Math.floor(azar() * 3)], b: azar() }));
const nebulosas = [[-1500, -700, 900, '255,181,71'], [900, -900, 1000, '180,140,255'], [-300, 900, 1100, '79,209,255'], [1700, 700, 800, '67,230,160']];
function fondo() {
  ctx.fillStyle = '#050714'; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, c] of nebulosas) {
    const sx = (x - est.cam.x) * 0.3 + W / 2, sy = (y - est.cam.y) * 0.3 + H / 2;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 0.6); g.addColorStop(0, `rgba(${c},0.09)`); g.addColorStop(1, 'rgba(5,7,20,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  for (const s of estrellas) {
    let x = ((s.x - est.cam.x * s.p) % 6000 + 9000) % 6000 - 3000 + W / 2, y = ((s.y - est.cam.y * s.p) % 4400 + 6600) % 4400 - 2200 + H / 2;
    if (x < -2 || y < -2 || x > W + 2 || y > H + 2) continue;
    ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(est.t * 0.008 + s.b * 9));
    ctx.fillStyle = s.b > 0.9 ? '#ffd9a0' : '#cfd6ff'; const z = s.p > 0.5 ? 1.8 : 1; ctx.fillRect(x, y, z, z);
  }
  ctx.globalAlpha = 1;
}
const P = (x, y) => [x - est.cam.x + W / 2, y - est.cam.y + H / 2];

// ══════════════════════ Estructuras ══════════════════════
function halo(x, y, r, rgb, a) { const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 2.2); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, 7); ctx.fill(); }
function esfera(x, y, r, color, sombra = '#0a1a3a') { const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r); g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, color); g.addColorStop(1, sombra); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
const DIBUJOS = {
  anillo(x, y, f) {         // la base: red privada
    ctx.strokeStyle = K.cian; ctx.lineWidth = 3; ctx.globalAlpha = f; ctx.beginPath(); ctx.ellipse(x, y, 120 * f, 46 * f, 0, 0, 7); ctx.stroke();
    ctx.lineWidth = 1; ctx.setLineDash([6, 6]); for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(x, y, (40 + i * 26) * f, (15 + i * 10) * f, 0, 0, 7); ctx.stroke(); } ctx.setLineDash([]);
    for (let i = 0; i < 8; i++) { const a = i / 8 * 6.28 + est.t * 0.004; ctx.fillStyle = K.cian; ctx.fillRect(x + Math.cos(a) * 120 * f - 3, y + Math.sin(a) * 46 * f - 3, 6, 6); } ctx.globalAlpha = 1;
  },
  astillero(x, y, f) {      // donde corren los contenedores
    ctx.globalAlpha = f; ctx.strokeStyle = '#9fb0e0'; ctx.lineWidth = 2; ctx.strokeRect(x - 90, y - 34, 180, 68);
    for (let i = 0; i < 6; i++) { const on = (Math.floor(est.t / 30) + i) % 6 !== 0; ctx.fillStyle = on ? K.cian : K.ok; ctx.fillRect(x - 80 + i * 28, y - 20, 20 * f, 40 * f); }
    ctx.fillStyle = '#9fb0e0'; ctx.fillRect(x - 100, y - 4, 200, 8); ctx.globalAlpha = 1;
  },
  bodega(x, y, f) {         // el registro de imágenes + la grúa del pipeline
    ctx.globalAlpha = f; for (let i = 0; i < 9; i++) { ctx.fillStyle = ['#c98a54', '#a8703f', '#e0a36b'][i % 3]; ctx.fillRect(x - 60 + (i % 3) * 40, y - 10 - Math.floor(i / 3) * 26, 36, 22); }
    ctx.strokeStyle = K.ok; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 80, y + 20); ctx.lineTo(x + 80, y - 90); ctx.lineTo(x - 20, y - 90); ctx.stroke();
    const g = (Math.sin(est.t * 0.03) + 1) / 2; ctx.beginPath(); ctx.moveTo(x - 20 + g * 60, y - 90); ctx.lineTo(x - 20 + g * 60, y - 60); ctx.stroke(); ctx.globalAlpha = 1;
  },
  boveda(x, y, f) {         // secretos
    ctx.globalAlpha = f; ctx.fillStyle = '#1a2150'; ctx.beginPath(); ctx.arc(x, y, 52 * f, 0, 7); ctx.fill(); ctx.strokeStyle = K.oro; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.translate(x, y); ctx.rotate(est.t * 0.01); for (let i = 0; i < 6; i++) { ctx.rotate(Math.PI / 3); ctx.fillStyle = K.oro; ctx.fillRect(18, -3, 22 * f, 6); } ctx.restore();
    ctx.fillStyle = K.oro; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  },
  archivo(x, y, f) {        // el event store
    ctx.globalAlpha = f; ctx.fillStyle = '#03040c'; ctx.beginPath(); ctx.arc(x, y, 44 * f, 0, 7); ctx.fill();
    ctx.strokeStyle = K.ok; for (let i = 0; i < 4; i++) { ctx.globalAlpha = f * (0.8 - i * 0.15); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(x, y, (64 + i * 16) * f, (16 + i * 4) * f, -0.25 + Math.sin(est.t * 0.01) * 0.05, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
  },
  faro(x, y, f) {           // el frontend
    ctx.globalAlpha = f; ctx.fillStyle = '#cfe9ff'; ctx.beginPath(); ctx.moveTo(x - 16, y + 50); ctx.lineTo(x + 16, y + 50); ctx.lineTo(x + 8, y - 40); ctx.lineTo(x - 8, y - 40); ctx.fill();
    const a = est.t * 0.02; ctx.fillStyle = 'rgba(67,230,160,0.18)'; ctx.beginPath(); ctx.moveTo(x, y - 44); ctx.lineTo(x + Math.cos(a) * 260, y - 44 + Math.sin(a) * 80); ctx.lineTo(x + Math.cos(a + 0.25) * 260, y - 44 + Math.sin(a + 0.25) * 80); ctx.fill();
    ctx.fillStyle = K.ok; ctx.beginPath(); ctx.arc(x, y - 46, 9, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  },
  portal(x, y, f) {         // Front Door
    halo(x, y, 50 * f, '79,209,255', 0.35); ctx.globalAlpha = f;
    for (let i = 0; i < 3; i++) { ctx.strokeStyle = i ? 'rgba(79,209,255,0.5)' : K.cian; ctx.lineWidth = i ? 2 : 4; ctx.beginPath(); ctx.ellipse(x, y, (34 + i * 14) * f, (70 + i * 18) * f, 0, 0, 7); ctx.stroke(); }
    ctx.save(); ctx.translate(x, y); ctx.rotate(est.t * 0.03); ctx.setLineDash([3, 8]); ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.stroke(); ctx.restore(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  },
  aduana(x, y, f) {         // el Gateway
    ctx.save(); ctx.translate(x, y); ctx.rotate(est.t * 0.005); ctx.globalAlpha = f; ctx.strokeStyle = K.cian; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 56 * f, 0, 7); ctx.stroke();
    for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); ctx.fillStyle = '#cfe9ff'; ctx.fillRect(50 * f, -5, 14, 10); } ctx.restore();
    ctx.globalAlpha = f; ctx.fillStyle = '#163a66'; ctx.beginPath(); ctx.arc(x, y, 24 * f, 0, 7); ctx.fill(); ctx.strokeStyle = K.cian; ctx.stroke(); ctx.globalAlpha = 1;
  },
  estacion(x, y, f) {       // Control Plane
    halo(x, y, 70 * f, '255,181,71', 0.45); ctx.globalAlpha = f; esfera(x, y, 46 * f, K.oro, '#8a3d10');
    ctx.strokeStyle = 'rgba(255,181,71,0.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x, y, 130 * f, 52 * f, 0, 0, 7); ctx.stroke();
    for (let i = 0; i < 6; i++) { const a = i / 6 * 6.28 + est.t * 0.006; esfera(x + Math.cos(a) * 130 * f, y + Math.sin(a) * 52 * f, 9 * f, K.oro, '#5a2a10'); } ctx.globalAlpha = 1;
  },
  hiperespacio(x, y, f) {   // la mensajería
    halo(x, y, 40 * f, '180,140,255', 0.5); ctx.save(); ctx.translate(x, y); ctx.rotate(est.t * 0.03); ctx.globalAlpha = f; ctx.strokeStyle = K.lila; ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(46, -14, 40, 28); ctx.stroke(); } ctx.restore();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  },
  orbita(x, y, f) {         // RabbitMQ: rutas cortas dentro del producto
    ctx.globalAlpha = f; ctx.strokeStyle = K.naranja; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(x, y, (30 + i * 22) * f, (12 + i * 9) * f, est.t * 0.004 * (i + 1), 0, 7); ctx.stroke(); }
    for (let i = 0; i < 5; i++) { const a = est.t * 0.03 + i * 1.25; ctx.fillStyle = K.naranja; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 52 * f, y + Math.sin(a) * 21 * f, 3, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  },
  pasaporte(x, y, f) {      // WorkOS: la identidad del usuario y de su tenant
    ctx.globalAlpha = f; ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(est.t * 0.01) * 0.12);
    ctx.fillStyle = '#1a2150'; ctx.strokeStyle = K.oro; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(-52 * f, -34 * f, 104 * f, 68 * f, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = K.oro; ctx.beginPath(); ctx.arc(-26 * f, -2, 13 * f, 0, 7); ctx.fill();
    ctx.fillStyle = '#98a0cf'; for (let i = 0; i < 3; i++) ctx.fillRect(-4, -14 + i * 12, 44 * f, 4);
    ctx.restore(); ctx.globalAlpha = 1;
  },
  planetas(x, y, f) {       // los productos del Application Plane
    const ps = [[-90, 10, 44, '#3fb6e8'], [70, -30, 34, '#5c8cff'], [120, 60, 26, '#4bc4b0']];
    for (const [dx, dy, r, c] of ps) { halo(x + dx, y + dy, r * f, '79,209,255', 0.15); esfera(x + dx, y + dy, r * f, c); }
    for (let i = 0; i < 4; i++) { const a = i * 1.6 + est.t * 0.008; esfera(x - 90 + Math.cos(a) * 70 * f, y + 10 + Math.sin(a) * 40 * f, 7 * f, '#8fdcff'); }
  },
  escudo(x, y, f) {         // hardening
    ctx.globalAlpha = f * (0.5 + Math.sin(est.t * 0.05) * 0.15); ctx.strokeStyle = K.ok; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i / 6 * 6.28; ctx.lineTo(x + Math.cos(a) * 70 * f, y + Math.sin(a) * 70 * f); } ctx.closePath(); ctx.stroke();
    ctx.fillStyle = 'rgba(67,230,160,0.07)'; ctx.fill(); ctx.globalAlpha = 1;
  },
  observatorio(x, y, f) {   // métricas
    ctx.globalAlpha = f; ctx.fillStyle = '#cfd6ff'; ctx.beginPath(); ctx.arc(x, y + 10, 34 * f, Math.PI, 0); ctx.fill();
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.6 + Math.sin(est.t * 0.01) * 0.3); ctx.fillStyle = '#9fb0e0'; ctx.fillRect(-6, -40 * f, 12, 40 * f); ctx.restore();
