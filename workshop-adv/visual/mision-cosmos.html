<title>Misión Cosmos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: un juego a pantalla completa. El canvas es el espacio. Arriba, el marcador y el objetivo;
   a la derecha, la ficha del sector (aduana, control del dron, mesa de Radicación); abajo a la
   izquierda, la radio con COSMO; abajo a la derecha, los botones de acción. Los paneles grandes
   (elegir, predecir, nombrar, glosario) se abren encima y pausan el juego. Un solo look oscuro. */
:root {
  color-scheme: dark;
  --vacio: #050714;
  --panel: #0a0f2cf2;
  --borde: #283270;
  --texto: #eef0ff;
  --tenue: #98a0cf;
  --oro: #ffb547;
  --cian: #4fd1ff;
  --lila: #b48cff;
  --ok: #43e6a0;
  --mal: #ff4d6d;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --cuerpo: "Atkinson Hyperlegible", system-ui, sans-serif;
  --codigo: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--vacio); color: var(--texto); font-family: var(--cuerpo); font-size: 15px; overflow: hidden; }
#juego { position: fixed; inset: 0; }
#lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
[hidden] { display: none !important; }

.hud { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.titulo { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 2px 10px #000; }
.titulo span { color: var(--oro); }
.medidor { background: #0a0f2ccc; border: 1px solid var(--borde); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.medidor b { font-family: var(--display); color: var(--oro); }
.empuje { flex: 1; }
.boton { font-family: var(--display); font-weight: 500; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; padding: 8px 12px; border: 1px solid var(--borde); border-radius: 4px; background: #0d1336e6; white-space: nowrap; }
.boton:hover { border-color: var(--cian); }
.boton.oro { background: #4a3510; border-color: var(--oro); color: #ffe2a8; }

.objetivo { position: absolute; top: calc(52px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); background: #0a0f2ce6; border: 1px solid var(--borde); border-radius: 8px; padding: 8px 14px; text-align: center; pointer-events: none; }
.objetivo b { font-family: var(--display); font-size: 15px; letter-spacing: 1px; display: block; }
.objetivo span { font-size: 13px; color: var(--tenue); font-variant-numeric: tabular-nums; }

.ficha { position: absolute; right: 16px; top: calc(110px + env(safe-area-inset-top, 0px)); width: min(320px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ficha-t { font-family: var(--display); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--tenue); }
.ficha dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.ficha dt { color: var(--tenue); }
.ficha .grande { font-family: var(--codigo); font-size: 22px; }
.ficha .acciones-f { display: flex; flex-direction: column; gap: 6px; }
.ficha .acciones-f button { text-align: left; padding: 9px 10px; border: 1px solid var(--borde); border-radius: 6px; background: #121a46; }
.ficha .acciones-f button:hover { border-color: var(--cian); }
.ficha .acciones-f kbd { font-family: var(--codigo); font-size: 12px; color: var(--oro); margin-right: 8px; }
.ficha input[type=range] { width: 100%; accent-color: var(--oro); }
.ficha .registro { font-family: var(--codigo); font-size: 12px; color: var(--tenue); line-height: 1.6; }
.bandera { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
.si { color: var(--ok); } .no { color: var(--mal); } .oro { color: var(--oro); }
.barra-t { height: 4px; background: #1a2150; border-radius: 2px; overflow: hidden; }
.barra-t i { display: block; height: 100%; background: var(--oro); }

.radio { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(470px, calc(100% - 120px)); display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 14px; }
.radio canvas { width: 48px; height: 48px; }
.radio .quien { font-family: var(--display); font-size: 11px; letter-spacing: 2px; color: var(--cian); text-transform: uppercase; }
.radio p { line-height: 1.45; margin-top: 3px; }
#radio-acc:not(:empty) { margin-top: 8px; }

.acciones { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; }
.accion { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--cian); background: #0d1336e6; font-family: var(--display); font-weight: 700; font-size: 20px; display: grid; place-content: center; line-height: 1; }
.accion small { font-size: 10px; letter-spacing: 1px; color: var(--tenue); font-weight: 500; text-transform: uppercase; margin-top: 3px; }
.accion.f { border-color: var(--mal); }

.capa { position: absolute; inset: 0; display: grid; place-items: center; background: #02030acc; padding: 16px; }
.caja { width: min(640px, 100%); max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 80px #000; }
.caja header { display: flex; flex-direction: column; gap: 4px; }
.sector { font-family: var(--display); font-size: 12px; letter-spacing: 2px; color: var(--tenue); text-transform: uppercase; }
.caja h2 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.5px; text-wrap: balance; }
.caja p { line-height: 1.5; }
.tenue { color: var(--tenue); }
.opciones { display: flex; flex-direction: column; gap: 8px; }
.opcion { text-align: left; padding: 12px 14px; border: 1px solid var(--borde); border-radius: 8px; background: #121a46; line-height: 1.4; }
.opcion:hover:not(:disabled) { border-color: var(--cian); }
.opcion:disabled { cursor: default; opacity: 0.55; }
.opcion.bien { border-color: var(--ok); opacity: 1; background: #0f3a33; }
.opcion.mal { border-color: var(--mal); background: #3a1022; }
.nota { border-radius: 8px; padding: 12px 14px; line-height: 1.5; }
.nota.bien { background: #0f3a33; border: 1px solid #1f7a5f; }
.nota.mal { background: #3a1022; border: 1px solid #7a1f3a; }
.pie { display: flex; justify-content: flex-end; gap: 8px; }
.pares { width: 100%; border-collapse: collapse; font-size: 14px; }
.pares th { text-align: left; font-family: var(--display); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--tenue); padding: 0 8px 6px 0; }
.pares td { border-top: 1px solid var(--borde); padding: 8px 8px 8px 0; vertical-align: middle; }
.real { background: #0d1336; border-left: 3px solid var(--oro); border-radius: 0 8px 8px 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.chip { display: inline-block; font-family: var(--display); font-size: 13px; padding: 2px 9px; margin: 1px 0; border: 1px solid var(--oro); border-radius: 999px; background: #2a1f0a; color: #ffe2a8; }
.chip:hover { background: #4a3510; }
.lista-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.def dl { display: grid; gap: 4px 0; }
.def dt { font-family: var(--display); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--tenue); margin-top: 8px; }
.def dd { line-height: 1.5; }
#def { z-index: 5; }

@media (max-width: 680px) {
  .titulo { font-size: 14px; letter-spacing: 2px; }
  .objetivo { top: calc(88px + env(safe-area-inset-top, 0px)); }
  .ficha { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); right: 16px; left: 16px; width: auto; padding: 10px 12px; gap: 6px; }
  .radio { width: calc(100% - 32px); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); grid-template-columns: 36px minmax(0, 1fr); padding: 10px 12px; }
  .radio canvas { width: 36px; height: 36px; }
  .radio p { font-size: 14px; }
  .accion { width: 56px; height: 56px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="juego">
  <canvas id="lienzo" aria-label="El espacio de Cosmos: tu nave y los sectores"></canvas>

  <div class="hud">
    <div class="titulo">Misión <span>Cosmos</span></div>
    <div class="medidor">Sectores <b id="m-sec">0/3</b></div>
    <div class="medidor"><b id="m-est">0</b> ★</div>
    <div class="empuje"></div>
    <button class="boton" id="b-glosario">Glosario · <span id="m-glo">0</span></button>
    <button class="boton" id="b-reinicio">Reiniciar</button>
  </div>

  <div class="objetivo" id="objetivo" hidden><b id="obj-t"></b><span id="obj-c"></span></div>
  <div class="ficha" id="ficha" hidden></div>

  <div class="radio" role="status" aria-live="polite">
    <canvas id="cara" width="96" height="96" aria-hidden="true"></canvas>
    <div>
      <div class="quien">COSMO · copiloto</div>
      <p id="dice"></p>
      <div id="radio-acc"></div>
    </div>
  </div>

  <div class="acciones">
    <button class="accion f" id="b-f" hidden>F<small>disparar</small></button>
    <button class="accion" id="b-e">E<small>usar</small></button>
  </div>

  <div class="capa" id="capa" hidden><div class="caja" id="caja" role="dialog" aria-modal="true"></div></div>
  <div class="capa" id="def" hidden><div class="caja def" id="def-caja" role="dialog" aria-modal="true"></div></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Regla de diseño: antes de la etapa "nombres", ningún término técnico aparece en pantalla.
// Cada sector: lo haces a mano → sientes el problema → eliges qué construir → lo pruebas y
// lo rompes → predices → recién ahí aprendes cómo se llama y cómo está en Cosmos hoy.
// Cada término tiene su entrada en GLOSARIO, en lenguaje llano.
// ---------------------------------------------------------------------------

const GLOSARIO = {
  'contenedor': {
    llano: 'Un programa empacado junto con todo lo que necesita para correr, para que funcione igual en cualquier máquina.',
    juego: 'Cada módulo del anillo.',
    cosmos: 'Cada servicio de Cosmos (por ejemplo, la API de Radicación) corre como un contenedor de Docker.' },
  'orquestador': {
    llano: 'Un programa que vigila tus contenedores: los arranca, los reparte y repone los que se caen, sin que nadie se lo pida.',
    juego: 'El dron.',
    cosmos: 'Cosmos usa [[Docker Swarm]] como orquestador.' },
  'Docker Swarm': {
    llano: 'El orquestador que viene incluido en Docker. Le describes qué servicios quieres y cuántas copias de cada uno, y él lo mantiene así.',
    juego: 'El modelo de dron que usa Cosmos.',
    cosmos: 'Cada producto tiene un archivo stack.prod.yml que le dice a Swarm qué servicios correr y cómo.' },
  'réplicas': {
    llano: 'Copias idénticas del mismo contenedor. Si una cae, las demás siguen atendiendo.',
    juego: 'Los módulos encendidos del anillo.',
    cosmos: 'Hoy cada servicio de Cosmos corre con una sola réplica.' },
  'estado deseado': {
    llano: 'Lo que tú declaras que debe existir ("quiero 3 copias"). El orquestador compara eso con lo que hay y corrige la diferencia.',
    juego: 'El número que pusiste en el control del dron.',
    cosmos: 'Se escribe en el stack.prod.yml de cada producto.' },
  'VM': {
    llano: 'Máquina virtual: un computador que alquilas en la nube. Por dentro se comporta como un servidor completo.',
    juego: 'La estación donde viven los módulos y el dron.',
    cosmos: 'Cada producto tiene su propia VM, una para desarrollo y otra para producción.' },
  'punto único de falla': {
    llano: 'Una pieza que, si se cae, tumba todo lo que depende de ella, porque no hay otra que la reemplace.',
    juego: 'La estación: si cae, caen el dron y todos los módulos.',
    cosmos: 'Hoy cada producto vive en una sola [[VM]]. La documentación planea 3 para producción.' },
  'Azure Front Door': {
    llano: 'La puerta de entrada global de Microsoft Azure: recibe el tráfico de internet hacia tu dominio y lo envía al servicio correcto.',
    juego: 'El portal oficial.',
    cosmos: 'app.sincoerp.ai entra por Front Door, que reparte por ruta (/api/oxp, /api/impu…).' },
  'X-Azure-FDID': {
    llano: 'Un dato que Front Door agrega a cada petición con su identificador. Quien lo revisa sabe que la petición pasó por la entrada oficial.',
    juego: 'El sello del portal.',
    cosmos: 'El [[YARP]] del [[Application Plane]] rechaza las peticiones que no traen el identificador correcto.' },
  'token JWT': {
    llano: 'Un texto firmado digitalmente que dice quién eres. Cualquiera puede leerlo, pero nadie puede cambiarlo sin romper la firma.',
    juego: 'El pasaporte.',
    cosmos: '[[WorkOS]] lo entrega cuando el usuario inicia sesión, y viaja en cada petición.' },
  'WorkOS': {
    llano: 'Un servicio externo que se encarga del inicio de sesión de los usuarios y firma sus tokens.',
    juego: 'La Oficina de Pasaportes.',
    cosmos: 'Cada empresa cliente es una organización en WorkOS.' },
  'tenant': {
    llano: 'Cada cliente que usa el mismo software que los demás sin ver los datos de los otros. La palabra significa "inquilino".',
    juego: 'Cada empresa: Andes, Sur y Norte.',
    cosmos: 'La organización de [[WorkOS]] es el tenant de Cosmos. Los datos de todos los tenants viven en las mismas tablas, separados por una columna tenant_id.' },
  'claim': {
    llano: 'Cada dato escrito dentro de un token: tu correo, tu empresa, tu rol.',
    juego: 'La empresa escrita en el pasaporte.',
    cosmos: 'Los tokens de Cosmos llevan los claims tenant_id y user_email.' },
  'header': {
    llano: 'Una etiqueta que viaja pegada a una petición web. La escribe quien envía la petición, así que puede decir lo que quiera.',
    juego: 'La bandera de la nave.',
    cosmos: 'X-Tenant-Id es el header con el tenant. El [[YARP]] borra el que llega y lo vuelve a escribir con el tenant del [[token JWT]].' },
  'YARP': {
    llano: 'Un programa de Microsoft que se pone delante de tus servicios, revisa cada petición y la reenvía al destino correcto.',
    juego: 'El robot de aduana.',
    cosmos: 'Vive en la VM del [[Application Plane]]. Detrás de él, cada producto tiene su [[nginx]].' },
  'Application Plane': {
    llano: 'La parte de Cosmos que comparten todos los productos: la entrada, el inicio de sesión, el frontend.',
    juego: 'La zona de la aduana, que sirve a todas las empresas.',
    cosmos: 'Corre en su propia VM (vm-appl).' },
  'nginx': {
    llano: 'Un servidor web muy usado como repartidor: recibe peticiones y las pasa a otro servicio según la ruta.',
    juego: 'Las compuertas de cada zona del planeta.',
    cosmos: 'Cada producto tiene uno en su VM. No revisa tokens: confía en lo que ya revisó el [[YARP]].' },
  'fail-open': {
    llano: 'Cuando un control no puede revisar y deja pasar todo. Lo seguro casi siempre es lo contrario: no dejar pasar a nadie (fail-closed).',
    juego: 'El robot sin lista de sellos que dejó entrar piratas.',
    cosmos: 'La auditoría señaló este riesgo en la revisión del sello: hay que confirmar que, si falta la configuración, se rechaza.' },
  'petición síncrona': {
    llano: 'Pides algo y te quedas esperando la respuesta antes de hacer otra cosa.',
    juego: 'Llevar la factura en la mano y esperar a que Radicación despierte.',
    cosmos: 'Las pantallas de Cosmos llaman así al servidor: esperan su respuesta.' },
  'cola de mensajes': {
    llano: 'Un lugar donde un servicio deja mensajes y otro los recoge cuando puede. Los mensajes esperan ahí y no se pierden.',
    juego: 'El buzón.',
    cosmos: 'Radicacion-From-EntradasExchange es la cola donde Radicación recibe lo que avisa Entradas.' },
  'mensajería asíncrona': {
    llano: 'Enviar y seguir con lo tuyo, sin esperar respuesta. Quien recibe lo procesa a su ritmo.',
    juego: 'Dejar la factura en el buzón y volver por la siguiente.',
    cosmos: 'Los servicios de cada producto se avisan así entre ellos.' },
  'RabbitMQ': {
    llano: 'Un programa que maneja colas de mensajes. Se instala junto a tus servicios.',
    juego: 'El buzón dentro del producto.',
    cosmos: 'Lo usa OXP entre sus servicios: Entradas, Reconocimiento, Radicación…' },
  'Azure Service Bus': {
    llano: 'El servicio de colas de mensajes de Azure, administrado por Microsoft.',
    juego: 'El buzón entre productos.',
    cosmos: 'Hay uno solo para todos los productos, con un canal por cada tipo de aviso.' },
  'entrega al menos una vez': {
    llano: 'La promesa de que un mensaje siempre llega, aunque a veces llegue dos veces. Es el precio de no perder ninguno.',
    juego: 'El buzón que repite la factura cuando duda.',
    cosmos: 'Así entregan [[RabbitMQ]] y [[Azure Service Bus]].' },
  'idempotencia': {
    llano: 'Que hacer algo dos veces dé el mismo resultado que hacerlo una vez.',
    juego: 'El registro de facturas radicadas.',
    cosmos: 'Cada servicio de Cosmos que recibe mensajes debe tolerar los repetidos.' },
};

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/\[\[(.+?)\]\]/g, (m, t) => `<button class="chip" data-t="${t}">${t}</button>`);
const rnd = n => Math.floor(Math.random() * n);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const barajar = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let est = { h: [], g: [], e: 0 };
try { const g = JSON.parse(localStorage.getItem('mision-cosmos-v2')); if (g && Array.isArray(g.h)) est = g; } catch (e) {}
function guardar() { try { localStorage.setItem('mision-cosmos-v2', JSON.stringify(est)); } catch (e) {} actualizarHud(); }
function sumar(n) { est.e += n; guardar(); flotante('+' + n + '★', nave.x, nave.y - 30, '#ffb547'); }
function actualizarHud() {
  $('#m-sec').textContent = est.h.length + '/' + SECTORES.length;
  $('#m-est').textContent = est.e;
  $('#m-glo').textContent = est.g.length;
}

// ---------- Radio, ficha, paneles ----------
let pausa = false;
function decir(texto, acc) {
  $('#dice').innerHTML = fmt(texto);
  const r = $('#radio-acc');
  r.innerHTML = '';
  if (acc) {
    const b = document.createElement('button');
    b.className = 'boton oro'; b.id = 'racc'; b.textContent = acc[0] + ' ›';
    b.onclick = () => { r.innerHTML = ''; acc[1](); };
    r.appendChild(b);
  }
}
let fichaHtml = null;
function ficha(html) {
  const f = $('#ficha');
  if (html == null) { f.hidden = true; fichaHtml = null; return; }
  f.hidden = false;
  if (html !== fichaHtml) { f.innerHTML = html; fichaHtml = html; }
}
function mostrarF(si) { $('#b-f').hidden = !si; }

function abrir(html) {
  $('#caja').innerHTML = html;
  $('#capa').hidden = false; pausa = true;
  const b = $('#caja').querySelector('button:not(:disabled)'); if (b) b.focus();
}
function cerrar() { $('#capa').hidden = true; pausa = !$('#def').hidden; }

function eleccion(c) {
  let fallos = 0;
  abrir(`<header><span class="sector">Construye</span><h2>${esc(c.titulo)}</h2></header>
    <p>${fmt(c.pregunta)}</p>
    <div class="opciones">${c.opciones.map((o, i) => `<button class="opcion" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="nota" id="nota" hidden></div><div class="pie" id="pie"></div>`);
  document.querySelectorAll('#caja .opcion').forEach(b => b.onclick = () => {
    const o = c.opciones[+b.dataset.i], nota = $('#nota');
    nota.hidden = false;
    if (!o.ok) {
      fallos++; b.disabled = true; b.classList.add('mal');
      nota.className = 'nota mal'; nota.innerHTML = fmt(o.porque) + '<br><span class="tenue">Elige otra.</span>';
      return;
    }
    document.querySelectorAll('#caja .opcion').forEach(x => x.disabled = true);
    b.classList.add('bien');
    const gana = fallos === 0 ? 2 : 0;
    if (gana) sumar(gana);
    nota.className = 'nota bien';
    nota.innerHTML = fmt(o.porque) + (gana ? ` <b class="oro">+${gana}★</b>` : '');
    $('#pie').innerHTML = '<button class="boton oro" id="sigue">Construirlo ›</button>';
    $('#sigue').onclick = () => { cerrar(); c.luego(); };
    $('#sigue').focus();
  });
}

function prediccion(c) {
  abrir(`<header><span class="sector">Predice antes de verlo</span><h2>${esc(c.titulo || '¿Qué crees que pasa?')}</h2></header>
    <p>${fmt(c.pregunta)}</p>
    <div class="opciones">${c.opciones.map((t, i) => `<button class="opcion" data-i="${i}">${esc(t)}</button>`).join('')}</div>
    <div class="nota" id="nota" hidden></div><div class="pie" id="pie"></div>`);
  document.querySelectorAll('#caja .opcion').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, bien = i === c.correcta, nota = $('#nota');
    document.querySelectorAll('#caja .opcion').forEach((x, k) => { x.disabled = true; if (k === c.correcta) x.classList.add('bien'); });
    if (!bien) b.classList.add('mal');

    nota.hidden = false; nota.className = 'nota ' + (bien ? 'bien' : 'mal');
    nota.innerHTML = (bien ? '<b>Exacto.</b> ' : '<b>No.</b> ') + fmt(c.explica) + (bien ? ' <b class="oro">+3★</b>' : '');
    $('#pie').innerHTML = '<button class="boton oro" id="sigue">Seguir ›</button>';
    $('#sigue').onclick = () => { cerrar(); c.luego(); };
    $('#sigue').focus();
  });
}

// ---------- Efectos ----------
const flotantes = [], particulas = [];
function flotante(txt, x, y, c) { flotantes.push({ txt, x, y, c: c || '#eef0ff', t: 1.4 }); }
function chispa(x, y, c, n) {
  for (let i = 0; i < (n || 14); i++) {
    const a = Math.random() * 6.283, v = 40 + Math.random() * 140;
    particulas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0.6 + Math.random() * 0.4, c });
  }
}

// ---------- Nave ----------
const nave = { x: 0, y: 80, vx: 0, vy: 0, ang: -Math.PI / 2 };
let destino = null;
const teclas = new Set();
const cerca = (p, r) => Math.hypot(nave.x - p.x, nave.y - p.y) < r;

// =====================================================================
// SECTOR 1 · El astillero — mantener algo encendido sin estar tú ahí
// =====================================================================
function iniciarAstillero(def) {
  const [cx, cy] = def.centro;
  const S = { fase: 'intro', mods: [], met: [], pets: [], t: 0, perd: 0, aten: 0, manoP: 0, manoT: 0,
    cadaMet: 2.3, relojMet: 1.2, relojPet: 0, dron: { x: cx, y: cy, obj: null }, deseado: 3,
    rotos: 0, laser: null, crecio: false, tc: 0 };
  const fuente = { x: cx - 430, y: cy };

  function poner(n) {
    const viejos = S.mods; S.mods = [];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      S.mods.push({ x: cx + Math.cos(a) * 180, y: cy + Math.sin(a) * 105, vivo: viejos[i] ? viejos[i].vivo : true });
    }
  }
  poner(3);

  function meteoro() {
    const vivos = S.mods.filter(m => m.vivo); if (!vivos.length) return;
    const obj = vivos[rnd(vivos.length)], a = Math.random() * 6.283;
    S.met.push({ x: cx + Math.cos(a) * 620, y: cy + Math.sin(a) * 520, obj });
  }
  function moverDron(dt) {
    const d = S.dron;
    if (!d.obj || d.obj.vivo || !S.mods.includes(d.obj))
      d.obj = S.mods.filter(m => !m.vivo).sort((a, b) => dist(a, d) - dist(b, d))[0] || null;
    const tx = d.obj ? d.obj.x : cx, ty = d.obj ? d.obj.y : cy;
    const dx = tx - d.x, dy = ty - d.y, l = Math.hypot(dx, dy), v = 260 * dt;
    if (l > v) { d.x += dx / l * v; d.y += dy / l * v; }
    else { d.x = tx; d.y = ty; if (d.obj) { d.obj.vivo = true; chispa(d.obj.x, d.obj.y, '#43e6a0'); d.obj = null; } }
  }
  const pct = (p, t) => t ? Math.round(100 * p / t) : 0;

  decir('Esta estación atiende clientes. Cada punto blanco que llega desde la izquierda es un pedido, y cada pedido va a uno de los módulos del anillo. Los meteoritos apagan módulos, y los pedidos que llegan a un módulo apagado se pierden. **Vuela a cada módulo rojo y pulsa E para encenderlo.** Tienes 40 segundos.',
    ['Empezar', () => { S.fase = 'mano'; S.t = 40; S.perd = 0; S.aten = 0; }]);

  function finMano() {
    S.fase = 'espera'; S.manoP = S.perd; S.manoT = S.perd + S.aten; S.met = []; S.pets = [];
    decir(`Se perdieron **${S.manoP} de ${S.manoT} pedidos (${pct(S.manoP, S.manoT)} %)**. Y eso fue con 6 módulos. Con 60 no darías abasto, y tú no puedes vivir aquí encendiendo módulos.`,
      ['¿Qué construimos?', () => eleccion({
        titulo: 'Los módulos se apagan solos',
        pregunta: '¿Qué construimos para que la estación siga atendiendo sin ti?',
        opciones: [
          { t: 'Blindar los módulos para que nunca se apaguen', ok: false, porque: 'Algo siempre falla: un meteorito, un error del programa, la memoria que se acaba. No puedes evitar que un módulo caiga. Lo que sí puedes es reponerlo rápido.' },
          { t: 'Un dron que sepa cuántos módulos deben estar encendidos y encienda solo los que se apaguen', ok: true, porque: 'El dron no necesita que nadie lo llame: compara lo que debería haber con lo que hay y corrige la diferencia, de día y de noche.' },
          { t: 'Escribir un manual para que otro piloto los encienda', ok: false, porque: 'Sigue dependiendo de alguien despierto y atento. A las 3 de la mañana nadie lee el manual.' },
        ],
        luego: iniciarDron,
      })]);
  }
  function iniciarDron() {
    poner(S.deseado); S.mods.forEach(m => m.vivo = true);
    S.fase = 'dron'; S.t = 25; S.perd = 0; S.aten = 0; S.cadaMet = 1.4;
    S.dron.x = cx; S.dron.y = cy;
    decir('Este es tu dron. En el control del dron le dices cuántos módulos deben estar encendidos, y él se encarga. **Pon 1 y mira qué pasa cuando cae ese único módulo. Después ponlo en 4.**');
  }
  function finDron() {
    S.fase = 'espera'; S.met = []; ficha(null);
    const tot = S.perd + S.aten;
    decir(`Con el dron se perdieron **${S.perd} de ${tot} (${pct(S.perd, tot)} %)**. A mano fueron ${S.manoP} de ${S.manoT}. Y no moviste un dedo. ¿Notaste que con 1 módulo cada caída deja todo sin atender, y con 4 casi no se nota? Ahora ponlo a prueba: tú serás el meteorito.`,
      ['Ponlo a prueba', () => {
        S.fase = 'rompe'; S.rotos = 0; poner(Math.max(3, S.deseado)); S.mods.forEach(m => m.vivo = true); mostrarF(true);
        decir('Acércate a un módulo encendido y **pulsa F para destruirlo**. Rompe 3 y mira qué hace el dron.');
      }]);
  }

  return {
    centro: { x: cx, y: cy },
    update(dt) {
      if (S.fase === 'mano' || S.fase === 'dron') {
        S.relojMet -= dt;
        if (S.relojMet <= 0) { S.relojMet = S.cadaMet * (0.7 + Math.random() * 0.6); meteoro(); }
      }
      if (S.fase === 'mano' || S.fase === 'dron' || S.fase === 'rompe') {
        S.relojPet -= dt;
        if (S.relojPet <= 0) { S.relojPet = 0.4; S.pets.push({ x: fuente.x, y: fuente.y + (Math.random() - 0.5) * 50, i: rnd(S.mods.length) }); }
      }
      for (let k = S.pets.length - 1; k >= 0; k--) {
        const p = S.pets[k], m = S.mods[p.i % S.mods.length];
        const dx = m.x - p.x, dy = m.y - p.y, l = Math.hypot(dx, dy), v = 330 * dt;
        if (l > v) { p.x += dx / l * v; p.y += dy / l * v; continue; }
        S.pets.splice(k, 1);
        if (S.fase === 'espera') continue;
        if (m.vivo) S.aten++; else { S.perd++; flotante('✕', m.x, m.y - 26, '#ff4d6d'); }
      }
      for (let k = S.met.length - 1; k >= 0; k--) {
        const me = S.met[k];
        if (!S.mods.includes(me.obj)) { S.met.splice(k, 1); continue; }
        const dx = me.obj.x - me.x, dy = me.obj.y - me.y, l = Math.hypot(dx, dy), v = 180 * dt;
        if (l > v + 14) { me.x += dx / l * v; me.y += dy / l * v; continue; }
        S.met.splice(k, 1);
        if (me.obj.vivo) { me.obj.vivo = false; chispa(me.obj.x, me.obj.y, '#ff8a5b', 18); }
      }
      if (S.laser) { S.laser.t -= dt; if (S.laser.t <= 0) S.laser = null; }
      if (S.fase === 'mano') {
        S.t -= dt;
        if (S.t <= 24 && !S.crecio) {
          S.crecio = true; poner(6); S.cadaMet = 1.2;
          decir('¡Llegaron más clientes! El anillo creció a **6 módulos** y los meteoritos caen más seguido. Sigue encendiendo los rojos con E.');
        }
        if (S.t <= 0) finMano();
      }
      if (S.fase === 'dron') {
        S.t -= dt; moverDron(dt);
        ficha(`<div class="ficha-t">Control del dron</div>
          <label for="deseado">Módulos que deben estar encendidos: <b class="oro">${S.deseado}</b></label>
          <input type="range" id="deseado" min="1" max="6" value="${S.deseado}" data-acc="deseado">
          <span class="tenue">Encendidos ahora: ${S.mods.filter(m => m.vivo).length} de ${S.mods.length}</span>`);
        if (S.t <= 0) finDron();
      }
      if (S.fase === 'rompe') {
        moverDron(dt);
        if (S.rotos >= 3 && S.mods.every(m => m.vivo)) {
          S.fase = 'espera'; mostrarF(false); S.pets = [];
          prediccion({
            pregunta: 'El dron repone todo lo que rompes. Pero el dron, los módulos y el anillo viven dentro de **la misma estación**. Si un meteorito gigante destruye la estación entera, ¿qué pasa?',
            opciones: ['El dron la reconstruye', 'Todo se apaga hasta que alguien construya otra estación', 'Los módulos se mudan solos a otra estación'],
            correcta: 1,
            explica: 'El dron vive dentro de la estación: si ella cae, cae con él. Nada repone lo que está por encima del dron. La única defensa es tener más de una estación, y un dron que pueda mover módulos entre ellas.',
            luego: () => { S.fase = 'caida'; S.tc = 2.4; chispa(cx, cy, '#ff4d6d', 60); decir('Así se ve: sin estación no hay dron, y sin dron nadie repone nada.'); },
          });
        }
      }
      if (S.fase === 'caida') {
        S.tc -= dt;
        if (S.tc <= 0) {
          S.fase = 'fin';
          bautizo({
            pares: [
              ['Cada módulo del anillo', 'contenedor'],
              ['El dron que repone lo que cae', 'orquestador'],
              ['El modelo de dron que usa Cosmos', 'Docker Swarm'],
              ['Los módulos encendidos al mismo tiempo', 'réplicas'],
              ['El número que pusiste en el control', 'estado deseado'],
              ['La estación', 'VM'],
              ['La estación, que si cae se lleva todo', 'punto único de falla'],
            ],
            real: 'Cada producto de Cosmos (OXP, Impuestos, Contabilidad…) tiene su propia [[VM]] con [[Docker Swarm]], una para desarrollo y otra para producción. Cada servicio es un [[contenedor]] y hoy corre con una sola copia (1 de [[réplicas]]): si se cae, Swarm lo vuelve a levantar. Al publicar una versión nueva, Swarm arranca el contenedor nuevo antes de apagar el viejo, y si el nuevo falla, vuelve al anterior. Lo que falta: cada producto vive en una sola VM, un [[punto único de falla]]. La documentación planea 3 VMs en producción.',
            luego: () => terminarSector(def),
          });
        }
      }
    },
    usar() {
      if (S.fase !== 'mano') { if (S.fase === 'dron') flotante('El dron se encarga', nave.x, nave.y - 30, '#98a0cf'); return; }
      const m = S.mods.filter(m => !m.vivo).sort((a, b) => dist(a, nave) - dist(b, nave))[0];
      if (m && dist(m, nave) < 80) { m.vivo = true; chispa(m.x, m.y, '#43e6a0'); }
      else flotante('Acércate a un módulo rojo', nave.x, nave.y - 30, '#98a0cf');
    },
    disparar() {
      if (S.fase !== 'rompe') return;
      const m = S.mods.filter(m => m.vivo).sort((a, b) => dist(a, nave) - dist(b, nave))[0];
      if (!m || dist(m, nave) > 300) { flotante('Acércate a un módulo encendido', nave.x, nave.y - 30, '#98a0cf'); return; }
      S.laser = { x1: nave.x, y1: nave.y, x2: m.x, y2: m.y, t: 0.25 };
      m.vivo = false; S.rotos++; chispa(m.x, m.y, '#ff4d6d', 22);
    },
    accion(a, v) {
      if (a === 'deseado' && v != null) { S.deseado = +v; poner(S.deseado); }
    },
    objetivo() {
      if (S.fase === 'mano') return ['Mantén encendidos los módulos', `⏱ ${Math.ceil(S.t)} s · atendidos ${S.aten} · perdidos ${S.perd}`];
      if (S.fase === 'dron') return ['Mira trabajar al dron', `⏱ ${Math.ceil(S.t)} s · atendidos ${S.aten} · perdidos ${S.perd}`];
      if (S.fase === 'rompe') return ['Rompe 3 módulos con F', `${S.rotos}/3 rotos`];
      return null;
    },
    dibujar(c) {
      const caida = S.fase === 'caida' || S.fase === 'fin';
      // fuente de pedidos
      c.fillStyle = '#98a0cf'; c.font = '600 14px "Chakra Petch", sans-serif'; c.textAlign = 'center';
      c.fillText('CLIENTES', fuente.x, fuente.y - 46);
      c.strokeStyle = '#4fd1ff66'; c.lineWidth = 2;
      c.beginPath(); c.arc(fuente.x, fuente.y, 26, 0, 6.283); c.stroke();
      // estación (anillo estructural)
      c.save();
      c.strokeStyle = caida ? '#3a1022' : '#1b2a66'; c.lineWidth = 16;
      c.beginPath(); c.ellipse(cx, cy, 180, 105, 0, 0, 6.283); c.stroke();
      c.strokeStyle = caida ? '#ff4d6d55' : '#4fd1ff33'; c.lineWidth = 2;
      c.beginPath(); c.ellipse(cx, cy, 214, 135, 0, 0, 6.283); c.stroke();
      c.restore();
      c.fillStyle = caida ? '#ff4d6d' : '#98a0cf'; c.font = '600 13px "Chakra Petch", sans-serif';
      c.fillText(caida ? 'ESTACIÓN DESTRUIDA' : 'ESTACIÓN', cx, cy + 165);
      // pedidos
      c.fillStyle = '#eef0ff';
      S.pets.forEach(p => { c.beginPath(); c.arc(p.x, p.y, 3.5, 0, 6.283); c.fill(); });
      // módulos
      S.mods.forEach(m => {
        const vivo = m.vivo && !caida;
        c.beginPath(); c.arc(m.x, m.y, 22, 0, 6.283);
        c.fillStyle = vivo ? '#0f4a6a' : '#3a1022'; c.fill();
        c.lineWidth = 3; c.strokeStyle = vivo ? '#4fd1ff' : '#ff4d6d'; c.stroke();
        if (vivo) { c.fillStyle = '#4fd1ff'; c.beginPath(); c.arc(m.x, m.y, 7, 0, 6.283); c.fill(); }
        else { c.strokeStyle = '#ff4d6d'; c.lineWidth = 3; c.beginPath(); c.moveTo(m.x - 7, m.y - 7); c.lineTo(m.x + 7, m.y + 7); c.moveTo(m.x + 7, m.y - 7); c.lineTo(m.x - 7, m.y + 7); c.stroke(); }
        if (!m.vivo && S.fase === 'mano' && dist(m, nave) < 80) {
          c.setLineDash([5, 5]); c.strokeStyle = '#ffb547'; c.lineWidth = 2;
          c.beginPath(); c.arc(m.x, m.y, 34, 0, 6.283); c.stroke(); c.setLineDash([]);
          c.fillStyle = '#ffb547'; c.font = '700 14px "Chakra Petch", sans-serif'; c.fillText('E', m.x, m.y - 40);
        }
      });
      // meteoritos
      S.met.forEach(me => {
        const dx = me.obj.x - me.x, dy = me.obj.y - me.y, l = Math.hypot(dx, dy) || 1;
        c.strokeStyle = '#ff8a5b55'; c.lineWidth = 6;
        c.beginPath(); c.moveTo(me.x, me.y); c.lineTo(me.x - dx / l * 30, me.y - dy / l * 30); c.stroke();
        c.fillStyle = '#a0603a'; c.beginPath(); c.arc(me.x, me.y, 9, 0, 6.283); c.fill();
      });
      // dron
      if (['dron', 'rompe'].includes(S.fase) || (S.fase === 'espera' && S.manoT && S.fase !== 'mano' && S.dron.x !== cx)) {
        const d = S.dron, g = performance.now() / 120;
        c.save(); c.translate(d.x, d.y); c.rotate(g);
        c.fillStyle = '#ffb547'; c.beginPath(); c.moveTo(0, -11); c.lineTo(11, 0); c.lineTo(0, 11); c.lineTo(-11, 0); c.closePath(); c.fill();
        c.restore();
        c.fillStyle = '#ffb547'; c.font = '600 12px "Chakra Petch", sans-serif'; c.fillText('DRON', d.x, d.y - 18);
      }
      if (S.laser) {
        c.strokeStyle = '#ff4d6d'; c.lineWidth = 3;
        c.beginPath(); c.moveTo(S.laser.x1, S.laser.y1); c.lineTo(S.laser.x2, S.laser.y2); c.stroke();
      }
    },
  };
}

// SECTOR 2 · La aduana — quién entra y a qué empresa

const EMPRESAS = [{ n: 'Andes', c: '#43e6a0' }, { n: 'Sur', c: '#ff8a5b' }, { n: 'Norte', c: '#7aa8ff' }];

function iniciarAduana(def) {
  const [cx, cy] = def.centro;
  const P = { portal: { x: cx - 420, y: cy - 120 }, cint: { x: cx - 420, y: cy + 160 }, puerta: { x: cx - 10, y: cy }, planeta: { x: cx + 360, y: cy } };
  const S = { fase: 'intro', ronda: 0, cola: [], idas: [], porSalir: [], relojSalida: 0, hechas: 0,
    ok: 0, err: 0, filt: 0, t: 0, llegadas: 0, revisadas: 0, relojRobot: 0, sabot: false, ts: 0, rok: 0, rfilt: 0 };
  const rocas = Array.from({ length: 26 }, () => ({ x: P.cint.x + (Math.random() - 0.5) * 220, y: P.cint.y + (Math.random() - 0.5) * 90, r: 3 + Math.random() * 8 }));
  const zona = k => { const a = Math.PI + (k - 1) * 0.8; return { x: P.planeta.x + Math.cos(a) * 118, y: P.planeta.y + Math.sin(a) * 118, a }; };

  function hacer(tipo) {
    const e = rnd(3);
    const n = { e, b: e, portal: tipo !== 'sinPortal', firma: tipo !== 'sinFirma', pirata: false };
    if (tipo === 'cambia') n.b = (e + 1 + rnd(2)) % 3;
    const o = n.portal ? P.portal : P.cint;
    n.x = o.x + (Math.random() - 0.5) * 30; n.y = o.y + (Math.random() - 0.5) * 30;
    return n;
  }
  const azar = r => {
    const x = Math.random();
    if (x < 0.3) return 'sinPortal';
    if (r >= 2 && x < 0.5) return 'sinFirma';
    if (r >= 3 && x < 0.7) return 'cambia';
    return 'ok';
  };
  function correcta(n, r) {
    if (!n.portal) return 'rechazar';
    if (r >= 2 && !n.firma) return 'rechazar';
    if (r >= 3 && n.b !== n.e) return 'cambiar';
    return 'pasar';
  }
  const RONDAS = {
    1: { tipos: ['ok', 'sinPortal', 'ok', 'sinPortal', 'ok', 'sinPortal'],
      msg: 'Esta es la aduana del planeta Cosmos. Ahí viven tres empresas, cada una en su zona: **Andes, Sur y Norte**. Primera regla: **solo entra quien pasó por el portal oficial** (arriba a la izquierda). Las naves que vienen del cinturón de asteroides se lo saltaron. Acércate a la aduana y decide con la ficha (o con las teclas 1 y 2).' },
    2: { tipos: ['ok', 'sinFirma', 'sinPortal', 'ok', 'sinFirma', 'ok'],

  }
  function decidirRepe(acc) {

    } else {
      if (!visto) { S.sinPagar++; flotante(`${id} quedó sin pagar`, R.x, R.y - 90, '#ff4d6d'); }

      S.fase = 'espera'; ficha(null);

        ['¿Qué construimos?', () => eleccion({
          titulo: 'Las facturas llegan repetidas',
          pregunta: '¿Cómo evitas pagar dos veces sin depender de tu memoria?',
          opciones: [
            { t: 'Pedirle al buzón que nunca repita', ok: false, porque: 'Para no repetir nunca, el buzón tendría que saber con certeza que cada entrega llegó, y a veces la confirmación se pierde en el camino. Es mucho más fácil que quien recibe aguante el repetido.' },
            { t: 'Revisar a fin de mes qué se pagó dos veces', ok: false, porque: 'Para entonces el dinero ya salió. Hay que evitarlo en el momento.' },
            { t: 'Un registro: anotar cada factura radicada y mirarlo antes de radicar', ok: true, porque: 'Con el registro, recibir la misma factura dos veces da el mismo resultado que recibirla una vez.' },
          ],
          luego: () => { S.fase = 'registro'; S.idx = 0; S.vistos = []; S.relojReg = 0.6; decir('Ahora Radicación tiene un registro. Mira cómo trata los repetidos.'); },
        })]);

  }

    centro: { x: cx, y: cy },

// Mapa y motor

const SECTORES = [
  { id: 'astillero', nombre: 'El astillero', sub: 'Mantener algo encendido', centro: [0, -560], color: '#4fd1ff', iniciar: iniciarAstillero },
  { id: 'aduana', nombre: 'La aduana', sub: 'Quién entra y a qué empresa', centro: [980, -60], color: '#ffb547', iniciar: iniciarAduana },
  { id: 'buzon', nombre: 'El buzón', sub: 'Avisar sin esperar', centro: [0, 680], color: '#b48cff', iniciar: iniciarBuzon },
];
const PROXIMOS = ['La base', 'La bodega y la grúa', 'La bóveda', 'El Archivo', 'Los planetas', 'El hiperespacio', 'El faro', 'La Estación de Control', 'El observatorio', 'El escudo']
  .map((n, i) => { const a = 2.4 + i * 0.62, r = 2100 + (i % 3) * 180; return { n, x: Math.cos(a) * r, y: Math.sin(a) * r }; });

const abierto = i => i === 0 || est.h.includes(SECTORES[i - 1].id);
let activo = null, actual = null;

function entrar(def) {
  activo = def; actual = def.iniciar(def); destino = null;
  nave.vx = nave.vy = 0;
}
function terminarSector(def) {
  const nuevo = !est.h.includes(def.id);
  if (nuevo) est.h.push(def.id);
  est.e += 5; guardar();
  ficha(null); mostrarF(false);
  activo = null; actual = null;
  const [cx, cy] = def.centro;
  const a = Math.atan2(nave.y - cy, nave.x - cx);
  nave.x = cx + Math.cos(a) * 340; nave.y = cy + Math.sin(a) * 340;
  const sig = SECTORES.find((s, i) => abierto(i) && !est.h.includes(s.id));
  if (sig) decir(`Sector completo. **${sig.nombre}** ya está abierto: sigue la flecha dorada. Puedes repasar los nombres en el Glosario.`);
  else decir(`Completaste los ${SECTORES.length} sectores de esta versión. Los otros ${PROXIMOS.length} llegarán con este mismo formato: primero a mano, después la solución, al final el nombre. Abre el Glosario para repasar.`);
}

const lienzo = $('#lienzo'), ctx = lienzo.getContext('2d');
let W = 0, H = 0, DPR = 1;
function ajustar() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  lienzo.width = W * DPR; lienzo.height = H * DPR;
}
addEventListener('resize', ajustar); ajustar();

const cam = { x: nave.x, y: nave.y, z: 1 };
const fondo = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), d: 0.15 + Math.random() * 0.6, r: Math.random() < 0.1 ? 1.6 : 0.9 }));

function actualizar(dt) {
  let ix = 0, iy = 0;
  if (teclas.has('arrowleft') || teclas.has('a')) ix--;
  if (teclas.has('arrowright') || teclas.has('d')) ix++;
  if (teclas.has('arrowup') || teclas.has('w')) iy--;
  if (teclas.has('arrowdown') || teclas.has('s')) iy++;
  if (ix || iy) destino = null;
  else if (destino) {
    const dx = destino.x - nave.x, dy = destino.y - nave.y, l = Math.hypot(dx, dy);
    if (l < 12) destino = null; else { ix = dx / l; iy = dy / l; if (l < 80) { ix *= l / 80; iy *= l / 80; } }
  }
  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
  const k = Math.min(1, dt * 6);
  nave.vx += (ix * 360 - nave.vx) * k; nave.vy += (iy * 360 - nave.vy) * k;
  nave.x += nave.vx * dt; nave.y += nave.vy * dt;
  if (Math.hypot(nave.vx, nave.vy) > 20) nave.ang = Math.atan2(nave.vy, nave.vx);

  if (activo) {
    const [cx, cy] = activo.centro, dx = nave.x - cx, dy = nave.y - cy, l = Math.hypot(dx, dy);
    if (l > 540) { nave.x = cx + dx / l * 540; nave.y = cy + dy / l * 540; }
    actual.update(dt);
  }

  for (let i = flotantes.length - 1; i >= 0; i--) { const f = flotantes[i]; f.t -= dt; f.y -= 26 * dt; if (f.t <= 0) flotantes.splice(i, 1); }
  for (let i = particulas.length - 1; i >= 0; i--) { const p = particulas[i]; p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; if (p.t <= 0) particulas.splice(i, 1); }
}

function cercano() {
  for (let i = 0; i < SECTORES.length; i++) {
    const s = SECTORES[i], d = Math.hypot(nave.x - s.centro[0], nave.y - s.centro[1]);
    if (d < 240) return { s, i };
  }
  return null;
}

function revisarEntrada() {
  if (activo || pausa) return;
  const c = cercano();
  if (c && abierto(c.i) && !est.h.includes(c.s.id)) entrar(c.s);
}

let objPrevio = '';
function pintarObjetivo() {
  let o = actual && actual.objetivo ? actual.objetivo() : null;
  if (!activo) {
    const c = cercano();
    if (c && est.h.includes(c.s.id)) o = [`${c.s.nombre} · completo`, 'Pulsa E para jugarlo otra vez'];
    else if (c && !abierto(c.i)) o = [`${c.s.nombre} · cerrado`, 'Completa el sector anterior para abrirlo'];
    else {
      const sig = SECTORES.find((s, i) => abierto(i) && !est.h.includes(s.id));
      o = sig ? [`Rumbo a ${sig.nombre}`, sig.sub] : ['Todos los sectores completos', 'Repite el que quieras: acércate y pulsa E'];
    }
  }
  const txt = o ? o.join('|') : '';
  if (txt === objPrevio) return;
  objPrevio = txt;
  $('#objetivo').hidden = !o;
  if (o) { $('#obj-t').textContent = o[0]; $('#obj-c').textContent = o[1] || ''; }
}

function usar() {
  if (pausa) return;
  if (actual) { actual.usar(); return; }
  const c = cercano();
  if (c && est.h.includes(c.s.id)) entrar(c.s);
}
function disparar() { if (!pausa && actual && actual.disparar) actual.disparar(); }

function dibujar() {
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = '#050714'; c.fillRect(0, 0, W, H);
  // cámara
  let tx = nave.x, ty = nave.y, tz = Math.max(0.6, Math.min(1, Math.min(W, H) / 760));
  if (activo) {
    tx = activo.centro[0] * 0.6 + nave.x * 0.4; ty = activo.centro[1] * 0.6 + nave.y * 0.4;
    tz = Math.max(0.42, Math.min(1, Math.min(W / 1150, H / 820)));
  }
  cam.x += (tx - cam.x) * 0.08; cam.y += (ty - cam.y) * 0.08; cam.z += (tz - cam.z) * 0.06;
  // estrellas
  fondo.forEach(s => {
    const x = ((s.x * W * 3 - cam.x * s.d) % W + W) % W, y = ((s.y * H * 3 - cam.y * s.d) % H + H) % H;
    c.fillStyle = `rgba(220,225,255,${0.25 + s.d})`; c.fillRect(x, y, s.r, s.r);
  });
  c.setTransform(DPR * cam.z, 0, 0, DPR * cam.z, DPR * (W / 2 - cam.x * cam.z), DPR * (H / 2 - cam.y * cam.z));
  c.textAlign = 'center';

  // próximos sectores
  PROXIMOS.forEach(p => {
    c.strokeStyle = '#28327066'; c.lineWidth = 2; c.setLineDash([4, 8]);
    c.beginPath(); c.arc(p.x, p.y, 120, 0, 6.283); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#5a628f'; c.font = '600 16px "Chakra Petch", sans-serif'; c.fillText(p.n.toUpperCase(), p.x, p.y);
    c.font = '500 12px "Chakra Petch", sans-serif'; c.fillText('próximamente', p.x, p.y + 20);
  });
  // sectores
  SECTORES.forEach((s, i) => {
    if (s === activo) return;
    const [x, y] = s.centro, hecho = est.h.includes(s.id), ab = abierto(i);
    const pul = 1 + Math.sin(performance.now() / 400) * 0.03;
    c.strokeStyle = ab ? s.color : '#283270'; c.lineWidth = hecho ? 3 : 5;
    if (!ab) c.setLineDash([6, 8]);
    c.beginPath(); c.arc(x, y, 200 * (ab && !hecho ? pul : 1), 0, 6.283); c.stroke(); c.setLineDash([]);
    c.fillStyle = ab ? s.color : '#5a628f'; c.font = '700 13px "Chakra Petch", sans-serif';
    c.fillText(`SECTOR ${i + 1}`, x, y - 16);
    c.font = '700 26px "Chakra Petch", sans-serif'; c.fillText(s.nombre.toUpperCase(), x, y + 14);
    c.font = '500 14px "Atkinson Hyperlegible", sans-serif'; c.fillStyle = '#98a0cf';
    c.fillText(hecho ? '✓ completo' : ab ? s.sub : 'cerrado', x, y + 40);
  });
  if (actual) actual.dibujar(c);

  // partículas y nave
  particulas.forEach(p => { c.globalAlpha = Math.max(0, p.t); c.fillStyle = p.c; c.fillRect(p.x - 2, p.y - 2, 4, 4); });
  c.globalAlpha = 1;
  c.save(); c.translate(nave.x, nave.y); c.rotate(nave.ang);
  if (Math.hypot(nave.vx, nave.vy) > 40) { c.fillStyle = '#ffb547'; c.beginPath(); c.moveTo(-12, -5); c.lineTo(-22 - Math.random() * 8, 0); c.lineTo(-12, 5); c.fill(); }
  c.fillStyle = '#eef0ff'; c.beginPath(); c.moveTo(18, 0); c.lineTo(-12, -11); c.lineTo(-7, 0); c.lineTo(-12, 11); c.closePath(); c.fill();
  c.fillStyle = '#4fd1ff'; c.beginPath(); c.arc(3, 0, 4, 0, 6.283); c.fill();
  c.restore();
  if (destino) { c.strokeStyle = '#4fd1ff66'; c.lineWidth = 1.5; c.beginPath(); c.arc(destino.x, destino.y, 10, 0, 6.283); c.stroke(); }
  flotantes.forEach(f => { c.globalAlpha = Math.min(1, f.t); c.fillStyle = f.c; c.font = '700 15px "Chakra Petch", sans-serif'; c.fillText(f.txt, f.x, f.y); });
  c.globalAlpha = 1;

  // flecha al siguiente sector
  if (!activo) {
    const sig = SECTORES.find((s, i) => abierto(i) && !est.h.includes(s.id));
    if (sig) {
      c.setTransform(DPR, 0, 0, DPR, 0, 0);
      const sx = W / 2 + (sig.centro[0] - cam.x) * cam.z, sy = H / 2 + (sig.centro[1] - cam.y) * cam.z;
      const m = 60;
      if (sx < m || sx > W - m || sy < m + 60 || sy > H - m - 80) {
        const a = Math.atan2(sy - H / 2, sx - W / 2);
        const ex = Math.max(m, Math.min(W - m, W / 2 + Math.cos(a) * W)), ey = Math.max(m + 60, Math.min(H - m - 80, H / 2 + Math.sin(a) * H));
        c.save(); c.translate(ex, ey); c.rotate(a);
        c.fillStyle = '#ffb547'; c.beginPath(); c.moveTo(16, 0); c.lineTo(-8, -10); c.lineTo(-8, 10); c.closePath(); c.fill();
        c.restore();
      }
    }
  }
}

let ultimo = performance.now(), relojObj = 0;
function bucle(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000); ultimo = ahora;
  if (!pausa) { actualizar(dt); revisarEntrada(); }
  relojObj -= dt; if (relojObj <= 0) { relojObj = 0.15; pintarObjetivo(); }
  dibujar();
  requestAnimationFrame(bucle);
}

// ---------- Entrada ----------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape' && !$('#def').hidden) { cerrarDef(); return; }
  if (pausa) return;
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  if (e.target.tagName === 'INPUT') return;
  teclas.add(k);
  if (k === 'e') usar();
  if (k === 'f') disparar();

    const bs = document.querySelectorAll('#ficha button[data-acc]');
    if (bs[+k - 1]) bs[+k - 1].click();
  }
});
